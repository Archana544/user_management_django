server {
    listen 80;

    # Serve React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ✅ Proxy API calls to backend
    location /api/ {
        proxy_pass https://my-containerapp.redgrass-66159ae4.westus.azurecontainerapps.io;
        proxy_set_header Host my-containerapp.redgrass-66159ae4.westus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}