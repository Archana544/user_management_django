version: "3.9"

services:

  # ─────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ai_doc_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────
  # Django Backend
  # ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_doc_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

# ─────────────────────────────
# Volumes
# ─────────────────────────────
volumes:
  postgres_data: